periodics:
  - name: ci-k8s-infra-agentic-ai
    interval: 24h
    cluster: k8s-infra-prow-build
    decorate: true
    decoration_config:
      timeout: 30m
    annotations:
      testgrid-dashboards: sig-k8s-infra-canaries
      testgrid-tab-name: agentic-ai
      description: Verifies that Prow can run Antigravity using k8s-infra-agentic-ai.
    extra_refs:
      - org: kubernetes
        repo: kops
        base_ref: master
        workdir: true
        path_alias: k8s.io/kops
    spec:
      serviceAccountName: agy-agent
      containers:
        - image: gcr.io/k8s-staging-infra-tools/antigravity:latest
          command:
            - agy
          args:
            - --model
            - gemini-4-argon-high
            - --project
            - k8s-infra-agentic-ai
            - --dangerously-skip-permissions
            - --print
            - |
              Analyze the project's dependencies in this repository and produce a comprehensive report covering:
              1. A deep, prioritized security analysis of dependency version gaps:
                 - Compare pinned versions against latest upstream releases and identify major/minor version lag.
                 - Highlight known or likely CVE/security exposure, deprecated/archived/unmaintained modules, and risky replace directives.
                 - Prioritize findings by severity, exploitability, and blast radius across the codebase.
              2. An investigation into how to reduce the dependency tree:
                 - Identify unused, redundant, or duplicate dependencies serving overlapping purposes.
                 - Pinpoint heavy transitive dependency chains (via go.mod / go mod graph / go mod why) and what pulls them in.
                 - Recommend concrete, actionable steps to prune dependencies, replace heavy packages with standard library or lighter alternatives, or split module boundaries.
          env:
            - name: AGY_ADC_AUTH
              value: "true"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: "k8s-infra-agentic-ai"
            - name: GOOGLE_CLOUD_QUOTA_PROJECT
              value: "k8s-infra-agentic-ai"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 4Gi
