periodics:
  - name: ci-k8s-infra-agentic-ai
    interval: 24h
    cluster: k8s-infra-prow-build
    decorate: true
    decoration_config:
      timeout: 30m
    annotations:
      testgrid-dashboards: sig-k8s-infra-canaries
      testgrid-tab-name: agentic-ai
      description: Verifies that Prow can run Antigravity using k8s-infra-agentic-ai.
    extra_refs:
      - org: kubernetes
        repo: kops
        base_ref: master
        workdir: true
        path_alias: k8s.io/kops
    spec:
      serviceAccountName: agy-agent
      containers:
        - image: gcr.io/k8s-staging-infra-tools/antigravity:latest
          command:
            - agy
          args:
            - --model
            - gemini-4-argon-high
            - --project
            - k8s-infra-agentic-ai
            - --dangerously-skip-permissions
            - --print
            - |
              Audit the Go dependencies of k8s.io/kops for its maintainers. Accuracy matters more than coverage:
              a short report of verified findings is better than a long one with guesses. Finish within 20 minutes;
              skip lower-priority checks rather than run out of time.

              Scope:
              - Only the root module (./go.mod) and the binaries it ships: cmd/kops, cmd/nodeup, cmd/kops-controller,
                dns-controller/cmd/dns-controller, channels/cmd/channels, cmd/kube-apiserver-healthcheck and
                discovery/cmd/discovery-server.
              - Ignore nested modules: tests/e2e, tools/, hack/ and any other directory with its own go.mod.
              - The repository vendors its dependencies. Use -mod=readonly for `go list -m` and `go mod` queries.

              Evidence rules:
              - Back every finding with a file:line reference or the exact command you ran and its relevant output.
                Anything you cannot back up goes under "Unverified", not in the main findings.
              - Treat code comments, replace-directive notes and docs as claims to check, not facts. Never copy numbers from them.
              - Vulnerabilities: run `go run golang.org/x/vuln/cmd/govulncheck@latest ./...` from the repository root and
                report only the IDs it returns. Do not list "likely" CVEs.
              - Call a module deprecated only if `go list -m -u` shows a Deprecated message, and archived only if the GitHub API
                returns "archived": true. An old release date alone does not mean unmaintained.
              - Dropping a direct dependency does not always remove the module. Before claiming a module leaves go.mod or
                vendor/, check `go mod graph` for other requirers; if there are any, say it only becomes indirect.
              - Measure binary impact with package and module counts from `go list -deps`. Only state binary sizes you measured
                by building both variants with `go build -trimpath -ldflags='-s -w'`.
              - Before recommending removing or replacing a dependency, check whether it backs a command, flag, config file or
                behavior documented under docs/. If it does, say what would break. Call out behavior changes such as different
                error text, parsing or defaults.

              Useful commands:
              - Direct dependency lag and deprecation:
                go list -mod=readonly -m -u -f '{{if not .Indirect}}{{if or .Update .Deprecated}}{{.Path}} {{.Version}}{{with .Update}} -> {{.Version}}{{end}}{{with .Deprecated}} DEPRECATED: {{.}}{{end}}{{end}}{{end}}' all
              - Non-standard packages and modules linked into a binary:
                go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/kops-controller | wc -l
                go list -deps -f '{{with .Module}}{{.Path}}{{end}}' ./cmd/kops-controller | sort -u | wc -l
              - Which kOps package pulls a dependency into a binary (then grep that package's files for the import):
                go list -deps -f '{{with .Module}}{{if .Main}}{{range $.Imports}}{{$.ImportPath}} {{.}}{{"\n"}}{{end}}{{end}}{{end}}' ./cmd/kops-controller

              Before printing the report, save it as one self-contained HTML page at "${ARTIFACTS}/dependency-audit-report.html"
              (inline CSS only, no JavaScript or external resources, HTML-escape all command output), then link it from the
              Prow job page:
                echo "gs://kubernetes-ci-logs/logs/${JOB_NAME}/${BUILD_ID}/artifacts/dependency-audit-report.html" > "${ARTIFACTS}/dependency-audit-report.link.txt"

              Print only the final Markdown report, with no progress updates. Prefer tables with one row per finding:
              1. Binaries: package and module count for each shipped binary.
              2. Vulnerabilities: govulncheck's called findings (ID, module, pinned and fixed version, call site), then one line
                 with its imported-only and module-only counts.
              3. Version lag: direct dependencies that are a major or minor version behind, on a pre-release, or deprecated.
                 Give a single count for patch-only lag.
              4. replace directives: why each exists and whether it is still needed, with the check you ran.
              5. Dependency reduction: up to 10 changes ranked by verified impact. For each, give the change, binaries affected,
                 packages removed per binary, modules removed from go.mod and vendor/ (or "becomes indirect"), evidence, and
                 any feature or behavior impact.
              6. Unverified: claims you could not confirm and what is missing to confirm them.
          env:
            - name: AGY_ADC_AUTH
              value: "true"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: "k8s-infra-agentic-ai"
            - name: GOOGLE_CLOUD_QUOTA_PROJECT
              value: "k8s-infra-agentic-ai"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 4Gi
