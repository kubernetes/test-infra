# DRA scalability jobs on AWS/EC2 (kops + ClusterLoader2).
#
# EC2 equivalent of ci-kubernetes-e2e-kops-gce-100-node-dra-with-workload-ipalias-using-cl2.
# Infra (cluster/creds/instance types/networking) mirrors the AWS load-test jobs in
# sig-scalability-periodic-ec2.yaml and sig-scalability-presubmit-jobs.yaml; the CL2 workload
# is swapped from the load test to the DRA test via KOPS_CL2_TEST_CONFIG=testing/dra/config.yaml.
# DRA itself needs no feature gate here: it is on-by-default in the stable k8s under test, and
# the DRA test driver + ResourceClaims are installed by testing/dra/config.yaml (same as the GCE
# DRA jobs, which also set no feature gate).
periodics:
- name: ci-kubernetes-e2e-kops-aws-500-node-dra-with-workload-amazonvpc-using-cl2
  tags:
  - "perfDashPrefix: aws-dra-500Nodes-with-workload"
  - "perfDashBuildsCount: 270"
  - "perfDashJobType: performance"
  cluster: eks-prow-build-cluster
  cron: '0 3 * * *' # Run every day at 03:00 UTC
  labels:
    preset-aws-ssh: "true"
    preset-aws-credential-boskos-scale-001-kops: "true"
    preset-kops-scalability-common: "true"
    preset-kops-scalability-ec2-common: "true"
    preset-kops-scalability-dra-common: "true"
    preset-kops-scalability-dra-500-node: "true"
  decorate: true
  decoration_config:
    timeout: 480m
  extra_refs:
  - org: kubernetes
    repo: kubernetes
    base_ref: master
    path_alias: k8s.io/kubernetes
  - org: kubernetes
    repo: perf-tests
    base_ref: master
    path_alias: k8s.io/perf-tests
  - org: kubernetes
    repo: kops
    base_ref: master
    path_alias: k8s.io/kops
    workdir: true
  annotations:
    karpenter.sh/do-not-disrupt: "true"
    test.kops.k8s.io/cloud: aws
    test.kops.k8s.io/distro: u2204
    test.kops.k8s.io/k8s_version: stable
    test.kops.k8s.io/kops_channel: alpha
    test.kops.k8s.io/networking: amazonvpc
    testgrid-dashboards: kops-misc, sig-cluster-lifecycle-kops, sig-scalability-aws, sig-scalability-dra
    testgrid-tab-name: ec2-dra-with-workload-master-scalability-500
    testgrid-alert-email: kubernetes-sig-scale@googlegroups.com, eks-scalability@amazon.com
    description: "Uses kops to run k8s.io/perf-tests/run-e2e.sh against a 500-node AWS cluster with DRA enabled"
  spec:
    containers:
    - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261009-d7b232c8fe-master
      imagePullPolicy: Always
      command:
      - runner.sh
      args:
      - ./tests/e2e/scenarios/scalability/run-test.sh
      resources:
        requests:
          cpu: 7
          memory: 24Gi
        limits:
          cpu: 7
          memory: 24Gi

- name: ci-kubernetes-e2e-kops-aws-5000-node-dra-with-workload-amazonvpc-using-cl2
  tags:
  - "perfDashPrefix: aws-dra-5000Nodes-with-workload"
  - "perfDashBuildsCount: 270"
  - "perfDashJobType: performance"
  cluster: eks-prow-build-cluster
  cron: "1 7 * * 2,4,6" # Tue/Thu/Sat 07:01 UTC; alternates with the 5k load test (Sun/Mon/Wed/Fri)
  labels:
    preset-aws-ssh: "true"
    preset-aws-credential-boskos-scale-001-kops: "true"
    preset-kops-scalability-common: "true"
    preset-kops-scalability-ec2-common: "true"
    preset-kops-scalability-dra-common: "true"
    preset-kops-scalability-dra-5000-node: "true"
  decorate: true
  job_queue_name: '5k-aws-scale-test'
  decoration_config:
    timeout: 480m
  extra_refs:
  - org: kubernetes
    repo: kubernetes
    base_ref: master
    path_alias: k8s.io/kubernetes
  - org: kubernetes
    repo: perf-tests
    base_ref: master
    path_alias: k8s.io/perf-tests
  - org: kubernetes
    repo: kops
    base_ref: master
    path_alias: k8s.io/kops
    workdir: true
  annotations:
    karpenter.sh/do-not-disrupt: "true"
    test.kops.k8s.io/cloud: aws
    test.kops.k8s.io/distro: u2204
    test.kops.k8s.io/k8s_version: stable
    test.kops.k8s.io/kops_channel: alpha
    test.kops.k8s.io/networking: amazonvpc
    testgrid-dashboards: kops-misc, sig-cluster-lifecycle-kops, sig-scalability-aws, sig-scalability-dra
    testgrid-tab-name: ec2-dra-with-workload-master-scalability-5000
    testgrid-alert-email: kubernetes-sig-scale@googlegroups.com, eks-scalability@amazon.com
    testgrid-num-failures-to-alert: '2'
    description: "Uses kops to run k8s.io/perf-tests/run-e2e.sh against a 5000-node AWS cluster with DRA enabled"
  spec:
    containers:
    - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261009-d7b232c8fe-master
      imagePullPolicy: Always
      command:
      - runner.sh
      args:
      - ./tests/e2e/scenarios/scalability/run-test.sh
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 7
          memory: 24Gi
        limits:
          cpu: 7
          memory: 24Gi

presubmits:
  kubernetes/perf-tests:
  - name: pull-perf-tests-ec2-500-node-dra-with-workload-amazonvpc-using-cl2
    cluster: eks-prow-build-cluster
    optional: true # new/expensive AWS scale job: provide signal without blocking merges
    always_run: false
    max_concurrency: 1
    labels:
      preset-aws-ssh: "true"
      preset-aws-credential-boskos-scale-001-kops: "true"
      preset-kops-scalability-ec2-common: "true"
      preset-kops-scalability-dra-common: "true"
      preset-kops-scalability-dra-500-node: "true"
    decorate: true
    decoration_config:
      timeout: 240m
    path_alias: k8s.io/perf-tests
    extra_refs:
    - org: kubernetes
      repo: kubernetes
      base_ref: master
      path_alias: k8s.io/kubernetes
    - org: kubernetes
      repo: kops
      base_ref: master
      workdir: true
      path_alias: k8s.io/kops
    annotations:
      testgrid-dashboards: presubmits-kubernetes-scalability
      testgrid-tab-name: pull-perf-tests-ec2-500-node-dra-with-workload
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261009-d7b232c8fe-master
        command:
        - runner.sh
        args:
        - ./tests/e2e/scenarios/scalability/run-test.sh
        resources:
          requests:
            cpu: 7
            memory: 24Gi
          limits:
            cpu: 7
            memory: 24Gi
