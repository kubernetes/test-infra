periodics:
- name: ci-build-and-push-k8s-at-golang-tip
  cluster: k8s-infra-prow-build
  cron: "0 0 * * *"
  labels:
    preset-service-account: "true"
    preset-dind-enabled: "true"
  decorate: true
  decoration_config:
    timeout: 75m
  extra_refs:
  - org: go.googlesource.com
    repo: go
    base_ref: master
    path_alias: golang
    clone_uri: https://go.googlesource.com/go
  - org: kubernetes
    repo: kubernetes
    base_ref: master
    path_alias: k8s.io/kubernetes
  - org: kubernetes
    repo: perf-tests
    base_ref: master
    path_alias: k8s.io/perf-tests
  - org: kubernetes
    repo: release
    base_ref: master
    path_alias: k8s.io/release
  annotations:
    testgrid-alert-email: kubernetes-sig-scale@googlegroups.com, kubernetes-scalability-tickets@google.com, go-kubernetes-scalability-tickets@googlegroups.com
    testgrid-dashboards: sig-scalability-golang
    testgrid-num-failures-to-alert: "3"
    testgrid-tab-name: build-and-push-k8s-at-golang-tip
  spec:
    containers:
    - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261005-65725656a4-master
      command:
      - runner.sh
      args:
      - make
      - --directory=/home/prow/go/src/k8s.io/perf-tests/golang
      # docker-in-docker needs privileged mode
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 4
          memory: "16Gi"
        limits:
          cpu: 4
          memory: "16Gi"

- name: ci-kubernetes-e2e-ec2-scale-performance-golang-tip-500
  tags:
  - "perfDashPrefix: golang-tip-k8s-master"
  - "perfDashJobType: performance"
  - "perfDashBuildsCount: 500"
  cluster: eks-prow-build-cluster
  cron: "0 11 * * *"
  labels:
    preset-aws-ssh: "true"
    preset-aws-credential-boskos-scale-001-kops: "true"
    preset-kops-scalability-common: "true"
    preset-kops-scalability-ec2-common: "true"
    preset-kops-scalability-ec2-500-node: "true"
  decorate: true
  decoration_config:
    timeout: 120m
  extra_refs:
  - org: kubernetes
    repo: kubernetes
    base_ref: master
    path_alias: k8s.io/kubernetes
  - org: kubernetes
    repo: perf-tests
    base_ref: master
    path_alias: k8s.io/perf-tests
  - org: kubernetes
    repo: kops
    base_ref: master
    path_alias: k8s.io/kops
    workdir: true
  annotations:
    test.kops.k8s.io/cloud: aws
    test.kops.k8s.io/distro: u2404
    test.kops.k8s.io/k8s_version: stable
    test.kops.k8s.io/kops_channel: alpha
    test.kops.k8s.io/networking: amazonvpc
    testgrid-dashboards: kops-misc, sig-cluster-lifecycle-kops, sig-scalability-aws, sig-scalability-golang, amazon-ec2-release
    testgrid-tab-name: ec2-master-scale-performance-golang-tip-500
    testgrid-alert-email: kubernetes-sig-scale@googlegroups.com, eks-scalability@amazon.com, release-team@kubernetes.io
    testgrid-days-of-results: "60"
    testgrid-num-columns-recent: "3"
    testgrid-num-failures-to-alert: "1"
  spec:
    containers:
    - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261005-65725656a4-master
      imagePullPolicy: Always
      command:
      - runner.sh
      args:
      - ./tests/e2e/scenarios/scalability/run-test.sh
      env:
      - name: K8S_VERSION
        value: https://storage.googleapis.com/k8s-infra-scale-golang-builds/ci/latest.txt
      - name: KOPS_ARCH
        value: amd64 # this k8s build doesn't build all arches :(
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 7
          memory: 24Gi
        limits:
          cpu: 7
          memory: 24Gi
