presubmits:
  kubernetes/perf-tests:
  - name: pull-perf-tests-benchmark-watchlist-proto-informer
    cluster: k8s-infra-prow-build
    always_run: false
    optional: true
    max_concurrency: 1
    labels:
      preset-service-account: "true"
      preset-k8s-ssh: "true"
      preset-dind-enabled: "true"
      preset-e2e-scalability-common: "true"
      preset-e2e-scalability-presubmits: "true"
    decorate: true
    decoration_config:
      timeout: 120m
    path_alias: k8s.io/perf-tests
    extra_refs:
    - org: kubernetes
      repo: kubernetes
      base_ref: master
      path_alias: k8s.io/kubernetes
    annotations:
      testgrid-dashboards: presubmits-kubernetes-scalability
      testgrid-tab-name: pull-perf-tests-benchmark-watchlist-proto-informer
    spec:
      containers:
      - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:v20261026-fb5e2ff7f3-master
        command:
        - runner.sh
        - /workspace/scenarios/kubernetes_e2e.py
        args:
        - --extract=ci/latest
        - --cluster=benchmark-list-informer
        - --gcp-master-size=n2-standard-32
        - --gcp-node-size=e2-standard-32
        - --gcp-node-image=gci
        - --gcp-nodes=3
        - --gcp-project-type=scalability-project
        - --gcp-zone=us-east1-b
        - --provider=gce
        - --metadata-sources=cl2-metadata.json
        - --env=KUBE_FEATURE_GATES=DetectCacheInconsistency=false
        - --env=KUBE_GCE_PRIVATE_CLUSTER=false
        - --env=CL2_LIST_CONFIG_MAP_NUMBER=0
        - --env=CL2_LIST_POD_NUMBER=150000
        - --env=CL2_LIST_BENCHMARK_PODS=10
        - --env=CL2_LIST_BENCHMARK_CONTENT_TYPE=proto
        - --env=CL2_LIST_BENCHMARK_MODE=informer
        - --env=CL2_LIST_ENABLE_WATCHLIST=true
        - --test=false
        - --test-cmd=$GOPATH/src/k8s.io/perf-tests/run-e2e.sh
        - --test-cmd-args=cluster-loader2
        - --test-cmd-args=--nodes=3
        - --test-cmd-args=--provider=gce
        - --test-cmd-args=--experimental-gcp-snapshot-prometheus-disk=true
        - --test-cmd-args=--experimental-prometheus-disk-snapshot-name=$(JOB_NAME)-$(BUILD_ID)
        - --test-cmd-args=--experimental-prometheus-snapshot-to-report-dir=true
        - --test-cmd-args=--report-dir=$(ARTIFACTS)
        - --test-cmd-args=--testconfig=testing/list/config.yaml
        - --test-cmd-name=ClusterLoaderV2
        - --timeout=90m
        - --use-logexporter
        - --logexporter-gcs-path=gs://k8s-infra-scalability-tests-logs/$(JOB_NAME)/$(BUILD_ID)
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 6
            memory: "16Gi"
          limits:
            cpu: 6
            memory: "16Gi"
