  - name: openstack-cloud-controller-manager-e2e-test
    cluster: k8s-infra-prow-build
    labels:
      preset-service-account: "true"
      preset-dind-enabled: "true"
    path_alias: "k8s.io/cloud-provider-openstack"
    always_run: false
    branches:
      - ^master$
      - ^release-1\.3[4-9]$
      - ^release-1\.[4-9]\d$
    run_if_changed: '^(pkg\/util\/|pkg\/openstack\/|cmd\/openstack-cloud-controller-manager\/|tests\/e2e\/cloudprovider\/|Dockerfile|tests\/playbooks)'
    optional: false
    decorate: true
    decoration_config:
      timeout: 3h
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261009-d7b232c8fe-master
          env:
          - name: "BOSKOS_HOST"
            value: "boskos.test-pods.svc.cluster.local"
          command:
          - "runner.sh"
          - "./tests/ci-occm-e2e.sh"
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: 2
              memory: 5Gi
            requests:
              cpu: 2
              memory: 5Gi
    annotations:
      testgrid-dashboards: provider-openstack-openstack-cloud-controller-manager
      testgrid-tab-name: presubmit-e2e-test

