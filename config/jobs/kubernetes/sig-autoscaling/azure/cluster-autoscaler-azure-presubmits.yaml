presubmits:
  kubernetes/autoscaler:
  - name: pull-autoscaling-e2e-aks-azure-ca-test
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-autoscaling-cluster-autoscaler
      testgrid-tab-name: cluster-autoscaler-aks-azure-e2e-test
    always_run: false
    optional: true
    run_if_changed: '^cluster-autoscaler\/'
    labels:
      preset-dind-enabled: "true"
      preset-kind-volume-mounts: "true"
      preset-azure-community: "true"
    decorate: true
    decoration_config:
      # Standard (5h) and DRA (90m), plus provisioning, builds, and cleanup.
      timeout: 8h
    path_alias: k8s.io/autoscaler
    branches:
      - ^master$
      - ^cluster-autoscaler-release-1\.(3[5-9]|[4-9][0-9]|[1-9][0-9]{2,})$
    extra_refs:
    - org: kubernetes-sigs
      repo: cluster-api-provider-azure
      base_ref: release-1.27
      path_alias: sigs.k8s.io/cluster-api-provider-azure
      workdir: true
    spec:
      serviceAccountName: azure
      containers:
      - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:v20261019-e80425793a-master
        command:
          - runner.sh
          - ./scripts/ci-entrypoint.sh
        args:
          - bash
          - -c
          - |
            set -euo pipefail
            # CAPZ exports checkout-relative tool paths; resolve them before cd.
            KUBECTL="$(readlink -f "${KUBECTL:?}")"
            HELM="$(readlink -f "${HELM:?}")"
            export KUBECTL HELM
            cd "${GOPATH}/src/k8s.io/autoscaler/cluster-autoscaler/cloudprovider/azure/test"
            make test-e2e-autoscaling TAG="$(git rev-parse --short HEAD)"
        env:
          - name: ADDITIONAL_ASO_CRDS
            value: authorization.azure.com/*;managedidentity.azure.com/*
          - name: KUBERNETES_VERSION
            value: "1.37"
          - name: AZURE_AKS_NODE_MACHINE_TYPE
            value: Standard_D4s_v5
          - name: CLUSTER_TEMPLATE
            value: ${GOPATH}/src/k8s.io/autoscaler/cluster-autoscaler/cloudprovider/azure/test/templates/cluster-template-prow-aks-aso-cluster-autoscaler.yaml
          - name: CLUSTER_AUTOSCALER_NAMESPACE
            value: kube-system
          - name: CLUSTER_AUTOSCALER_MIN_NODES
            value: "3"
          - name: CLUSTER_AUTOSCALER_MAX_NODES
            value: "6"
          - name: CLUSTER_AUTOSCALER_WINDOWS_NODE_COUNT
            value: "0"
          - name: CLUSTER_AUTOSCALER_SYSTEM_NODE_TAINTS
            value: '["CriticalAddonsOnly=true:NoSchedule"]'
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 4
            memory: "9Gi"
          limits:
            cpu: 4
            memory: "9Gi"
