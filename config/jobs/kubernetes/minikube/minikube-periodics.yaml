periodics:
# name convention: integration-<driver>-<container-runtime>-<OS>-<arch>
- name: ci-minikube-kvm-docker-linux-x86
  cluster: k8s-infra-prow-build
  interval: 24h
  decorate: true
  path_alias: "k8s.io/minikube"
  labels:
    preset-dind-enabled: "true"
    preset-service-account: "true"
    preset-k8s-ssh: "true"
  annotations:
    testgrid-dashboards: minikube-periodics
  extra_refs:
  - org: kubernetes
    repo: minikube
    base_ref: master
    path_alias: k8s.io/minikube
  spec:
    containers:
    - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20260824-a5e45c393a-master
      command:
      - runner.sh
      args:
      - make
      - integration-prow-kvm-docker-linux-x86
      # we need privileged mode in order to do docker in docker
      securityContext:
        privileged: true
      resources:
        requests:
          memory: 20Gi
          cpu: 7
        limits:
          memory: 20Gi
          cpu: 7
