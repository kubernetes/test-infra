presubmits:
  kubernetes/minikube:
  # name convention: pull-minikube-<driver>-<container-runtime>-<OS>-<arch>
  - name: pull-minikube-kvm-docker-linux-x86
    cluster: k8s-infra-prow-build
    decorate: true
    path_alias: "k8s.io/minikube"
    always_run: false
    skip_if_only_changed: '^site/|^netlify\.toml$'
    labels:
      preset-dind-enabled: "true"
      preset-service-account: "true"
      preset-k8s-ssh: "true"
    annotations:
      testgrid-dashboards: minikube-presubmits
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261023-e0cef2e94a-master
        command:
        - runner.sh
        args:
        - make
        - integration-prow-kvm-docker-linux-x86
        # we need privileged mode in order to do docker in docker
        securityContext:
          privileged: true
        resources:
          requests:
            memory: 2Gi
            cpu: 2
          limits:
            memory: 2Gi
            cpu: 2
