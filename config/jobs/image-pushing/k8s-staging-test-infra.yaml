# NOTE: only certain images with external inputs should have periodics!
periodics:
  - name: periodic-test-infra-push-krte
    cron: '0 9 * * MON' # weekly at 1am or 2am pacific on monday
    cluster: k8s-infra-prow-build-trusted
    annotations:
      testgrid-dashboards: sig-testing-image-pushes, sig-k8s-infra-gcb
      testgrid-tab-name: krte-periodic
      testgrid-alert-email: kubernetes-sig-testing-alerts@googlegroups.com, k8s-infra-alerts@kubernetes.io
      testgrid-num-failures-to-alert: '1'
      description: builds and pushes the krte image
    decorate: true
    extra_refs:
    - org: kubernetes
      repo: test-infra
      base_ref: master
      path_alias: k8s.io/test-infra
    max_concurrency: 1
    # avoid overloading GCB logs quota for the shared staging project
    job_queue_name: "test-infra-staging-image-push"
    spec:
      serviceAccountName: test-infra
      containers:
      - image: gcr.io/k8s-staging-test-infra/image-builder:v20260704-7722336b68
