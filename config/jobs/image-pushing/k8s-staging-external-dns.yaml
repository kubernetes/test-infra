postsubmits:
  # this is the github repo we'll build from; this block needs to be repeated for each repo.
  kubernetes-sigs/external-dns:
    - name: post-external-dns-push-images
      cluster: k8s-infra-prow-build-trusted
      annotations:
        # this is the name of some testgrid dashboard to report to.
        testgrid-dashboards: sig-network-external-dns, sig-k8s-infra-gcb
      decorate: true
      branches:
        - ^master$
        - ^v[0-9].*
      spec:
        serviceAccountName: external-dns
        containers:
          - image: gcr.io/k8s-staging-test-infra/image-builder:v20261013-5cade36dc1
            command:
              - /run.sh
            args:
              # this is the project GCB will run in, which is the same as the GCR images are pushed to.
              - --project=k8s-staging-images
              - --scratch-bucket=gs://k8s-staging-images-gcb
              - --env-passthrough=PULL_BASE_REF
              - --version-tag-filter=v*
              - .
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 1
                memory: 1Gi
    - name: post-external-dns-push-chart
      cluster: k8s-infra-prow-build-trusted
      annotations:
        testgrid-dashboards: sig-network-external-dns, sig-k8s-infra-gcb
      decorate: true
      branches:
        - ^master$
      run_if_changed: ^charts/external-dns/Chart\.yaml$
      spec:
        serviceAccountName: external-dns
        containers:
          - image: gcr.io/k8s-staging-test-infra/image-builder:v20261013-5cade36dc1
            command:
              - /run.sh
            args:
              - --project=k8s-staging-images
              - --scratch-bucket=gs://k8s-staging-images-gcb
              - --env-passthrough=PULL_BASE_REF
              - --build-dir=.
              - --with-git-dir
              - charts
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 1
                memory: 1Gi
