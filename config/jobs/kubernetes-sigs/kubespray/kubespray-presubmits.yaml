presubmits:
  kubernetes-sigs/kubespray:
  - name: pull-kubespray-yamllint
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-cluster-lifecycle-kubespray
      testgrid-tab-name: yamllint
    always_run: true
    skip_report: false
    decorate: true
    spec:
      containers:
      - image: quay.io/kubespray/kubespray:v2.13.0
        args:
        - yamllint
        - "--strict"
        - .
        resources:
          limits:
            cpu: 1
            memory: 4Gi
          requests:
            cpu: 1
            memory: 4Gi
  - name: pull-kubespray-kubevirt-image-builder-validate
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-cluster-lifecycle-kubespray
      testgrid-tab-name: kubevirt-image-builder-validate
    run_if_changed: '^test-infra/image-builder/.*'
    always_run: false
    skip_report: false
    decorate: true
    labels:
      preset-dind-enabled: "true"
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261023-e0cef2e94a-master
        command:
        - runner.sh
        args:
        - bash
        - -ceu
        - |
          apt-get update

          # Use Docker-in-Docker for this presubmit for now.
          # The rootless BuildKit path is currently blocked on eks-prow-build
          # because user namespaces are not available in that environment.
          # Keep the Kubespray-side BuildKit support, but validate this lane with Docker for now.
          # Tracking issue for the future rootless/userns path:
          # https://github.com/kubernetes/k8s.io/issues/9433
          apt-get install -y --no-install-recommends qemu-utils
          python3 -m pip install --no-cache-dir --break-system-packages ansible-core
          ansible-galaxy collection install community.general -p /usr/share/ansible/collections
          make -C test-infra/image-builder validate-single-docker

        # docker-in-docker needs privileged mode
        securityContext:
          privileged: true
        resources:
          limits:
            cpu: 1
            memory: 4Gi
          requests:
            cpu: 1
            memory: 4Gi
  - name: pull-kubespray-pre-commit
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-cluster-lifecycle-kubespray
      testgrid-tab-name: pre-commit
    always_run: true
    optional: true
    skip_report: false
    decorate: true
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261029-cd3d638333-master
        command:
        - runner.sh
        args:
        - bash
        - -ceux
        - |
          # markdownlint hook needs ruby
          apt-get update
          apt-get install -y --no-install-recommends ruby
          python3 -m pip install --no-cache-dir --break-system-packages pre-commit
          pre-commit run --hook-stage manual --all-files --show-diff-on-failure
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 2
            memory: 4Gi
  - name: pull-kubespray-terraform-validate
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-cluster-lifecycle-kubespray
      testgrid-tab-name: terraform-validate
    always_run: true
    optional: true
    skip_report: false
    decorate: true
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261029-cd3d638333-master
        command:
        - runner.sh
        args:
        - make
        - -k
        - -C
        - contrib/terraform
        - validate
        env:
        - name: TOFUENV_INSTALL_MODE
          value: mirror
        - name: TOFUENV_LIST_MODE
          value: mirror
        resources:
          limits:
            cpu: 1
            memory: 2Gi
          requests:
            cpu: 1
            memory: 2Gi
  - name: pull-kubespray-vagrant-validate
    cluster: eks-prow-build-cluster
    annotations:
      testgrid-dashboards: sig-cluster-lifecycle-kubespray
      testgrid-tab-name: vagrant-validate
    always_run: true
    optional: true
    skip_report: false
    decorate: true
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20261029-cd3d638333-master
        command:
        - runner.sh
        args:
        - bash
        - -ceux
        - |
          VAGRANT_VERSION=2.4.1
          cd /tmp
          curl -fsSLO "https://releases.hashicorp.com/vagrant/${VAGRANT_VERSION}/vagrant_${VAGRANT_VERSION}-1_amd64.deb"
          curl -fsSLO "https://releases.hashicorp.com/vagrant/${VAGRANT_VERSION}/vagrant_${VAGRANT_VERSION}_SHA256SUMS"
          sha256sum --ignore-missing -c "vagrant_${VAGRANT_VERSION}_SHA256SUMS"
          dpkg -i "vagrant_${VAGRANT_VERSION}-1_amd64.deb"
          cd -
          ./tests/scripts/vagrant-validate.sh
        resources:
          limits:
            cpu: 1
            memory: 2Gi
          requests:
            cpu: 1
            memory: 2Gi
