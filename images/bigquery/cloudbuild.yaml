steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/bigquery:$_GIT_TAG
      - --build-arg=IMAGE_ARG=gcr.io/$PROJECT_ID/bigquery:$_GIT_TAG
      - .
    dir: images/bigquery/
substitutions:
  _GIT_TAG: '12345'
serviceAccount: projects/k8s-staging-images/serviceAccounts/test-infra-sa@k8s-staging-images.iam.gserviceaccount.com
images:
  - 'gcr.io/$PROJECT_ID/bigquery:$_GIT_TAG'
