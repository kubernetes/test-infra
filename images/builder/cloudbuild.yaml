steps:
  - name: registry.k8s.io/releng/gcb-docker-gcloud:v20260806
    args:
    - bash
    - -c
    - |
      set -e
      for arch in amd64 arm64; do
        GOARCH=$$arch go build -o=./images/builder/builder-$$arch ./images/builder
      done
      docker build \
       --platform=linux/amd64,linux/arm64 \
       --tag=gcr.io/$PROJECT_ID/image-builder:$_GIT_TAG \
       --tag=gcr.io/$PROJECT_ID/image-builder:latest \
       --push \
       images/builder
    env:
    - CGO_ENABLED=0
substitutions:
  _GIT_TAG: '12345'
options:
  workerRelease: regular
  machineType: 'E2_HIGHCPU_8'
tags:
  - builder
