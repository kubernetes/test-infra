# Keep this file in sync with the other image-config*.yaml files in this directory.
images:
  ubuntu:
    image_family: pipeline-1-34-amd64
    project: ubuntu-os-gke-cloud
    # exclude the -cgroupsv1 images so that only cgroup v2 images are selected.
    # currently all images with cgroupv1 from gke have a -cgroupsv1 suffix
    image_exclude_regex: "-cgroupsv1$"
